name: Recipe Tests

on:
  push:
    branches: [ main, profiles ]
    paths:
      - 'run-recipe.py'
      - 'run-recipe.sh'
      - 'launch-cluster.sh'
      - 'autodiscover.sh'
      - 'cluster_topology.py'
      - 'setup-cluster.sh'
      - 'setup-cluster.py'
      - 'setup_cluster_node.py'
      - 'build-and-copy.sh'
      - 'docker/image_identity.py'
      - 'hf-download.sh'
      - 'hf-cache.py'
      - 'recipes/**'
      - 'mods/fix-qwen3-next-autoround/**'
      - 'mods/memory-profile/**'
      - 'tests/**'
      - '.github/workflows/test-recipes.yml'
  pull_request:
    paths:
      - 'run-recipe.py'
      - 'run-recipe.sh'
      - 'launch-cluster.sh'
      - 'autodiscover.sh'
      - 'cluster_topology.py'
      - 'setup-cluster.sh'
      - 'setup-cluster.py'
      - 'setup_cluster_node.py'
      - 'build-and-copy.sh'
      - 'docker/image_identity.py'
      - 'hf-download.sh'
      - 'hf-cache.py'
      - 'recipes/**'
      - 'mods/fix-qwen3-next-autoround/**'
      - 'mods/memory-profile/**'
      - 'tests/**'
      - '.github/workflows/test-recipes.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml 'matplotlib>=3.6'
    
    - name: Make scripts executable
      run: |
        chmod +x run-recipe.py run-recipe.sh launch-cluster.sh
        chmod +x tests/test_recipes.sh tests/test_launch_cluster_image_sync.sh
        chmod +x tests/test_launch_cluster_vllm_pr.sh
        chmod +x tests/test_launch_cluster_earlyoom.sh
    
    - name: Test Qwen3-Next AutoRound compatibility mod
      run: python3 tests/test_qwen3_next_autoround_mod.py

    - name: Test Hugging Face cache ownership repair
      run: python3 tests/test_hf_download_permissions.py

    - name: Test ring discovery and routed distribution
      run: python3 tests/test_cluster_topology.py

    - name: Test cluster setup and restore without live nodes
      run: |
        bash -n setup-cluster.sh
        python3 tests/test_setup_cluster.py

    - name: Test Hugging Face cache management and copies
      run: |
        python3 tests/test_hf_cache_management.py
        bash tests/test_hf_download_copy.sh

    - name: Test memory profiling mod
      run: |
        python3 tests/test_memory_profile_mod.py
        python3 tests/test_memory_capacity.py

    - name: Run recipe integration tests
      run: |
        ./tests/test_recipes.sh -v
        ./tests/test_launch_cluster_image_sync.sh
        ./tests/test_launch_cluster_vllm_pr.sh
        ./tests/test_launch_cluster_earlyoom.sh
        python3 tests/test_launch_cluster_networking.py

    - name: Test Docker image identity and distribution
      run: |
        python3 tests/test_image_identity.py
        bash tests/test_build_and_copy.sh
    
    - name: Verify all recipes with dry-run
      run: |
        for recipe in recipes/*.yaml; do
          name=$(basename "$recipe" .yaml)
          echo "Testing recipe: $name"
          if grep -qE '^cluster_only:[[:space:]]*true' "$recipe"; then
            ./run-recipe.py "$name" --dry-run -n "10.0.0.1,10.0.0.2" || exit 1
          else
            ./run-recipe.py "$name" --dry-run --solo || exit 1
          fi
        done
