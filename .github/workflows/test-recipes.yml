name: Recipe Tests

on:
  push:
    branches: [ main, profiles ]
    paths:
      - 'run-recipe.py'
      - 'run-recipe.sh'
      - 'run-stack.py'
      - 'run-stack.sh'
      - 'launch-cluster.sh'
      - 'recipes/**'
      - 'stacks/**'
      - 'tests/**'
      - '.github/workflows/test-recipes.yml'
  pull_request:
    paths:
      - 'run-recipe.py'
      - 'run-recipe.sh'
      - 'run-stack.py'
      - 'run-stack.sh'
      - 'launch-cluster.sh'
      - 'recipes/**'
      - 'stacks/**'
      - 'tests/**'
      - '.github/workflows/test-recipes.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
    
    - name: Make scripts executable
      run: |
        chmod +x run-recipe.py run-recipe.sh run-stack.py run-stack.sh launch-cluster.sh
        chmod +x tests/test_recipes.sh tests/test_stack.sh tests/test_launch_cluster_image_sync.sh
        chmod +x tests/test_launch_cluster_vllm_pr.sh

    - name: Run recipe integration tests
      run: |
        ./tests/test_recipes.sh -v
        ./tests/test_launch_cluster_image_sync.sh
        ./tests/test_launch_cluster_vllm_pr.sh

    - name: Run stack integration tests
      run: |
        ./tests/test_stack.sh -v

    - name: Verify all recipes with dry-run
      run: |
        for recipe in recipes/*.yaml; do
          name=$(basename "$recipe" .yaml)
          echo "Testing recipe: $name"
          if grep -qE '^cluster_only:[[:space:]]*true' "$recipe"; then
            ./run-recipe.py "$name" --dry-run -n "10.0.0.1,10.0.0.2" || exit 1
          else
            ./run-recipe.py "$name" --dry-run --solo || exit 1
          fi
        done

    - name: Verify all stacks with dry-run
      run: |
        for stack in stacks/*.yaml stacks/*.yml; do
          [ -e "$stack" ] || continue
          name=$(basename "$stack")
          echo "Testing stack: $name"
          ./run-stack.py "$stack" --dry-run || exit 1
        done
