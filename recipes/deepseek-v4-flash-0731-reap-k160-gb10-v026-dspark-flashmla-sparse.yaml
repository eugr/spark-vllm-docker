# Recipe: DeepSeek-V4-Flash-0731 REAP K160 on GB10 — vLLM v0.26.0, DSpark speculative
#
# DSpark sibling of deepseek-v4-flash-0731-reap-k160-gb10-v026-mtp.yaml. That
# recipe uses vLLM's generic --speculative-config method:"mtp". This one uses
# DSpark (method:"dspark"), a distinct speculative-decoding path ported
# byte-for-byte from https://github.com/MykhailoTamarin/vllm-starter
# (models/deepseek-v4-flash-0731-nvfp4-dspark.yaml + models/files/
# patch_vllm_k160_dspark.py + models/files/dspark_overlay/). Their own tested
# log (models/logs/deepseek-v4-flash-0731-nvfp4-dspark.log) shows all 18
# patch steps applying cleanly (ok=17 fail=0, one benign already-applied
# skip) against their pinned `vllm/vllm-openai:v0.26.0` image — so the patch
# set itself is verbatim-correct, not something to hand-edit.
#
# container is the PRISTINE `vllm/vllm-openai:v0.26.0`, matching upstream
# exactly — deliberately NOT this repo's own
# eugr-spark-vllm-deepseek-v4-reap-gb10:0.26-dgfix. dgfix already has a
# separately-authored REAP router-fallback/FlashInfer-IPC fix baked in at
# image-build time (mods/deepseek-v4-reap-gb10-v026), and its wording differs
# from what patch_vllm_k160_dspark.py's own router/IPC steps search for
# (`and not (` vs the ported script's `or (`, etc). Running the verbatim
# ported script against dgfix produces spurious "old text not found"
# failures that have nothing to do with DSpark — confirmed by testing
# against dgfix directly. Using the pristine image sidesteps the collision
# entirely and matches the exact environment upstream's own successful log
# was captured against. `mods/use-official-vllm` runs first (this repo's own
# documented convention for official vllm-openai images: installs git/
# earlyoom, fixes the DGX Spark NCCL-hang footgun) before the DSpark mod.
#
# What DSpark needs beyond a --speculative-config string, all handled by
# mods/deepseek-v4-reap-gb10-v026-dspark/patch_vllm_k160_dspark.py:
#   1. A whole-file overlay of 6 vLLM-internal source files (custom MoE
#      experts, sparse attention/MLA backends) copied wholesale over the
#      stock v0.26.0 files — see .../dspark_overlay/vllm/. These are NOT
#      upstream-vLLM files; they're hand-patched by the vllm-starter author.
#   2. A new KV-cache dtype, nvfp4_ds_mla, which doesn't exist in stock
#      vLLM 0.26.0 at all — config/cache.py, v1/kv_cache_interface.py, and
#      utils/torch_utils.py all need patching just to recognize the string.
#   3. b12x FP8 linear kernel enablement (soft-fallback instead of hard
#      ValueError, plus uncommenting FlashInferB12xNvFp4LinearKernel from
#      the auto-selection list).
# Its only change from the upstream file is DSPARK_OVERLAY's path: upstream
# bind-mounts it at /patch/dspark_overlay/vllm via a `volumes:` recipe key
# this repo's run-recipe.py/launch-cluster.sh has no equivalent for (mods are
# docker-cp'd into the container and run from their own copied-in directory,
# see mods/deepseek-v4-reap-gb10-v026/run.sh for the same pattern), so the
# overlay ships inside this mod directory instead, referenced relative to
# the script's own path. Every other line is byte-identical to upstream.
#
# patch_flashinfer_b12x_fp8.py is also included in the mod dir (ported
# as-is) for reference/manual reapplication, but is NOT invoked by run.sh:
# its two patches (soft-fallback linear backend, b12x NVFP4 kernel enable)
# are a strict subset of patch_vllm_k160_dspark.py's own _b12x_linear step,
# so running both would just double-apply (harmlessly skipped) the same
# diff.
#
# Sibling of deepseek-v4-flash-0731-reap-k160-gb10-v026-dspark-mod.yaml, only
# difference: explicit --attention-backend FLASHMLA_SPARSE instead of
# leaving it to vLLM's auto-selection. Confirmed via the overlay's own
# source (dspark_overlay/vllm/v1/attention/backends/mla/flashmla_sparse.py):
# FlashMLASparseBackend.get_name() returns "FLASHMLA_SPARSE", and its
# supported_kv_cache_dtypes list explicitly includes nvfp4_ds_mla — so this
# is very likely what auto-selection already picks for this KV-cache dtype,
# but pinning it explicitly removes that inference as a variable when
# comparing runs or debugging future vLLM upgrades that might change
# auto-selection heuristics.

recipe_version: "1"
name: DeepSeek-V4-Flash-0731-REAP-K160-GB10-v026-DSpark-FlashMLASparse
description: >-
  vLLM v0.26.0 serving 0xSero/DeepSeek-V4-Flash-0731-REAP (REAP K160, MXFP4
  experts) on a single DGX Spark GB10 node, with DSpark speculative decoding
  and attention backend explicitly pinned to FLASHMLA_SPARSE (nvfp4_ds_mla
  KV cache, b12x MoE backend) ported from vllm-starter.

model: 0xSero/DeepSeek-V4-Flash-0731-REAP
model_revision: ddc04540efda3d2a0788b129f1fad828ddc19b60
container: vllm/vllm-openai:v0.26.0

mods:
  - mods/deepseek-v4-reap-gb10-v026-dspark

defaults:
  port: 8000
  host: 0.0.0.0
  gpu_memory_utilization: 0.945
  max_model_len: 163840
  max_num_seqs: 4
  max_num_batched_tokens: 4120
  num_speculative_tokens: 7

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "10000"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  TILELANG_CLEANUP_TEMP_FILES: "1"
  DG_JIT_USE_NVRTC: "0"
  DG_JIT_NVCC_COMPILER: "/usr/local/cuda/bin/nvcc"
  NCCL_IB_DISABLE: "1"
  NCCL_DEBUG: "WARN"
  K160_DISABLE_CUTEDSL: "0"
  CUTEDSL_VERSION: ""
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"

command: |
  vllm serve 0xSero/DeepSeek-V4-Flash-0731-REAP \
    --revision ddc04540efda3d2a0788b129f1fad828ddc19b60 \
    --served-model-name deepseek-v4-flash-0731-REAP-K160-dspark \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size 1 \
    --pipeline-parallel-size 1 \
    --kv-cache-dtype nvfp4_ds_mla \
    --attention-backend FLASHMLA_SPARSE \
    --block-size 256 \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --distributed-executor-backend mp \
    --tokenizer-mode deepseek_v4 \
    --load-format safetensors \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}}' \
    --default-chat-template-kwargs '{{"thinking":true}}' \
    --default-chat-template-kwargs.reasoning_effort=high \
    --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
    --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"greedy"}}' \
    --generation-config vllm \
    --enable-flashinfer-autotune \
    --disable-access-log-for-endpoints /health,/metrics,/ping
