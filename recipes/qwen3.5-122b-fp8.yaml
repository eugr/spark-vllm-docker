# Recipe: Qwen3.5-122B-A10B-FP8
# Qwen3.5-122B model in native FP8 quantization
# Updated: 2026-03-27 with community optimizations

recipe_version: "1"
name: Qwen3.5-122B-FP8
description: vLLM serving Qwen3.5-122B-FP8 with FP8 KV cache + speculative decoding

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.5-122B-A10B-FP8

# Only cluster is supported
cluster_only: true

# Container image to use
container: vllm-node

# No mods required
mods:
  - mods/fix-qwen3.5-chat-template

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.7
  max_model_len: 262144
  max_num_batched_tokens: 8192

# Environment variables for optimization
env:
  VLLM_FLASHINFER_MOE_BACKEND: latency
  PYTORCH_ALLOC_CONF: expandable_segments:True

# The vLLM serve command template with ALL optimizations
command: |
  vllm serve Qwen/Qwen3.5-122B-A10B-FP8 \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --load-format fastsafetensors \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --chat-template unsloth.jinja \
    -tp {tensor_parallel} --distributed-executor-backend ray \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype fp8 \
    --swap-space 16 \
    --max-num-seqs 4 \
    --language-model-only \
    --speculative-config '{"method":"mtp","num_speculative_tokens":1}' \
    --enable-expert-parallel
