# Recipe: Qwen3.8-Flash-Next on a single DGX Spark (GB10) — blazux MODE=hybrid
# End-to-end mirror of blazux/qwen3.8-Flash-DGX scripts/serve.sh MODE=hybrid:
#   https://github.com/blazux/qwen3.8-Flash-DGX
#
# MODE=hybrid: NVFP4 routed experts unchanged, but the ~15 GiB of dense side
# layers (GDN proj, QSA q/k/v/o, shared experts) rewritten to blockwise fp8-e4m3
# (128x128, DeepSeek layout). Those layers are read in full on every decoded
# token, so halving them buys +20% decode (~31 tok/s) and +8% KV (~630k tokens)
# at identical tournament quality (45/51). Prefix caching + deterministic QSA
# top-k on, same as nvfp4.
#
# PREREQUISITE: the fp8-hybrid checkpoint must be prepared ONCE (~10 min, +13 GB
# disk). It writes a sibling snapshots/<snap>-fp8hybrid/ with a .prepared marker.
# Run inside the same image before first serve:
#   git clone https://github.com/blazux/qwen3.8-Flash-DGX.git && cd qwen3.8-Flash-DGX
#   docker build -t qwen38-flash-dgx .          # if not built yet
#   scripts/download-weights.sh                 # if weights not downloaded yet
#   scripts/prepare-hybrid.sh                   # one-time fp8 side-layer conversion
#
# IMAGE: qwen38-flash-dgx — FROM vllm/vllm-openai:qwen38-flash-next + 6
# blazux patches (PLE mmap, GB10 FLA fixes, Mamba race fix, prefix-caching
# block_size fix, exact QSA top-k, fp8 hybrid mode). run-recipe.py cannot build
# it (build-and-copy.sh only builds this repo's own Dockerfiles) — build direct:
#   docker build -t qwen38-flash-dgx qwen3.8-Flash-DGX
# (Already built on this box from sha b6dae9f under build/qwen3.8-Flash-DGX.)
# The plain `qwen38-flash-dgx` tag on this box is an unrelated patch-less image.

recipe_version: "1"
name: Qwen3.8-Flash-Next - blazux hybrid (fp8 side layers, +20% decode, prefix-cache + exact-topk)
description: >-
  vLLM serving the blazux hybrid checkpoint (NVFP4 experts + blockwise-fp8 side
  layers) of Qwen3.8-Flash-Next on one DGX Spark/GB10 via the qwen38-flash-dgx
  image. ~31 tok/s decode (+20% over nvfp4), ~630k-token KV, same tournament
  quality. Prefix caching and deterministic QSA top-k on, MTP=2, 262k context.
  Requires a one-time scripts/prepare-hybrid.sh. Mirror of blazux serve.sh
  MODE=hybrid.

container: qwen38-flash-dgx
model: RadixArk/Qwen3.8-Flash-Next-NVFP4

cluster_only: false
solo_only: true

# blazux serve.sh defaults: SEQS=8 GPU_MEM=0.85 MTP=2 CTX=262144.
defaults:
  port: 8000
  host: 0.0.0.0
  max_model_len: 262144
  max_num_seqs: 8
  gpu_memory_utilization: 0.94
  num_speculative_tokens: 2

# Hybrid adds VLLM_FP8_HYBRID=1 and VLLM_USE_DEEP_GEMM=0 (serve.sh HYBRID_ENV),
# on top of the shared PLE-mmap / exact-topk / flashinfer-sampler env.
env:
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_WORKERS: "32"
  VLLM_PLE_MMAP_PREWARM: "0"
  VLLM_QSA_EXACT_TOPK: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_FP8_HYBRID: "1"
  VLLM_USE_DEEP_GEMM: "0"

# Serve the prepared -fp8hybrid sibling snapshot (must contain .prepared), exactly
# as serve.sh MODE=hybrid does. Errors out with guidance if prepare-hybrid.sh has
# not been run. PLE gather stays outside CUDA graphs (PIECEWISE, never FULL). To
# serve WITHOUT MTP, delete the --speculative-config line and num_speculative_tokens.
command: |
  REPO_DIR="/root/.cache/huggingface/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4"
  BASE_SNAP="$(ls -d "$REPO_DIR"/snapshots/*/ 2>/dev/null | grep -v -- '-fp8hybrid' | head -1)"
  if [ -z "$BASE_SNAP" ]; then
    echo "!! checkpoint not found under $REPO_DIR — download it first (--download-only)" >&2
    exit 1
  fi
  SNAP_DIR="${{BASE_SNAP%/}}-fp8hybrid"
  if [ ! -f "$SNAP_DIR/.prepared" ]; then
    echo "!! hybrid checkpoint not prepared at $SNAP_DIR" >&2
    echo "   run blazux scripts/prepare-hybrid.sh once (one-time, ~10 min) before serving MODE=hybrid" >&2
    exit 1
  fi
  vllm serve "$SNAP_DIR" \
      --served-model-name qwen3.8-flash-next \
      --host {host} \
      --port {port} \
      --load-format safetensors \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --max-num-batched-tokens 4096 \
      -cc.cudagraph_mode=PIECEWISE \
      -cc.splitting_ops='["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer","vllm::ple_mmap_lookup"]' \
      --no-enable-flashinfer-autotune \
      --kv-cache-dtype auto \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser qwen3 \
      --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}'
