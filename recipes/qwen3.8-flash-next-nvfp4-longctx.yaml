# Recipe: Qwen3.8-Flash-Next NVFP4 long-context on a single DGX Spark (GB10)
# YAML mirror of the vllm-longctx recipe's serve.sh:
#   https://github.com/0xBakeer/qwen38-flash-next-spark/tree/main/recipes/vllm-longctx
#
# Long-context recipe: serve Qwen3.8-Flash-Next with vLLM, NVFP4 weights, and
# the model's own MTP draft head. The even performer -- ~32 tok/s on prose, flat
# decode from 1k to 128k ctx. Serves the ~51B-param n-gram (PLE) table from disk
# via mmap (VLLM_PLE_MMAP=1) instead of resident in the 128 GB unified pool.
#
# End-to-end mirror: same IMAGE and same ARGS as the reference.
#   - IMAGE   qwen38-flash-dgx  -- the exact image setup.sh builds from
#             blazux/qwen3.8-Flash-DGX (Apache-2.0). Build it first, either with
#             the recipe's own ./setup.sh, or:
#               git clone https://github.com/blazux/qwen3.8-Flash-DGX.git
#               docker build -t qwen38-flash-dgx qwen3.8-Flash-DGX
#   - ARGS    every serve flag, env var and default below is verbatim serve.sh.
# The blazux image's entrypoint is already `vllm serve`, so the command passes
# the snapshot dir + flags directly, exactly as serve.sh's docker run does.

recipe_version: "1"
name: Qwen3.8-Flash-Next-NVFP4 - long-context 16x262k MTP3 (mirror of vllm-longctx serve.sh)
description: >-
  YAML mirror of 0xBakeer/qwen38-flash-next-spark recipes/vllm-longctx/serve.sh:
  vLLM serving RadixArk/Qwen3.8-Flash-Next-NVFP4 on one DGX Spark/GB10, NVFP4
  weights, MTP draft head, full 262,144 context, 16 concurrent sequences,
  gpu_memory_utilization 0.93, prefix caching on, PLE n-gram table served from
  disk via mmap. Even throughput (~32 tok/s prose, flat to 128k ctx).

container: qwen38-flash-dgx
model: RadixArk/Qwen3.8-Flash-Next-NVFP4

cluster_only: false
solo_only: true

# serve.sh defaults (CTX=262144 SEQS=16 GPU_MEM=0.85 MTP=3), with one deliberate
# override: gpu_memory_utilization raised to 0.93 for more KV headroom.
defaults:
  port: 8000
  host: 0.0.0.0
  max_model_len: 262144
  max_num_seqs: 16
  gpu_memory_utilization: 0.93
  num_speculative_tokens: 3

# serve.sh env, verbatim:
#   VLLM_PLE_MMAP=1  VLLM_PLE_MMAP_WORKERS=32  VLLM_PLE_MMAP_PREWARM=1
#   VLLM_USE_FLASHINFER_SAMPLER=1
env:
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_WORKERS: "32"
  VLLM_PLE_MMAP_PREWARM: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"

# serve.sh's vllm invocation, mirrored flag-for-flag. The PLE-mmap patch mmaps
# the checkpoint's shards directly, so --model must be a local snapshot dir --
# the command resolves the downloaded snapshot itself, as serve.sh does.
# To serve WITHOUT MTP (MTP=0 in serve.sh), delete the --speculative-config
# line below and the num_speculative_tokens default above.
command: |
  REPO_DIR="/root/.cache/huggingface/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4"
  SNAP_DIR="$(ls -d "$REPO_DIR"/snapshots/*/ 2>/dev/null | head -1)"
  if [ -z "$SNAP_DIR" ]; then
    echo "!! checkpoint not found under $REPO_DIR — download it first (--download-only)" >&2
    exit 1
  fi
  vllm serve "$SNAP_DIR" \
      --served-model-name qwen3.8-flash-next \
      --host {host} \
      --port {port} \
      --load-format safetensors \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --max-num-batched-tokens 8192 \
      -cc.cudagraph_mode=PIECEWISE \
      -cc.splitting_ops='["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer","vllm::ple_mmap_lookup"]' \
      --no-enable-flashinfer-autotune \
      --enable-auto-tool-choice \
      --tool-call-parser qwen3_coder \
      --reasoning-parser qwen3 \
      --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}'
