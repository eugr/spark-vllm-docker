# Recipe: Qwen3.8-27B-NVFP4 with the in-checkpoint MTP head, extended to 1M
# context via static YaRN. Same target checkpoint and hardware assumptions as
# qwen3.8-27b-nvfp4.yaml - see that file's header for the TP=2 and autotune
# rationale, which applies here unchanged.
#
# Source for the rope block: the Qwen3.8-27B model card, "Best Practices ->
# Processing Ultra-Long Texts", reproduced verbatim apart from doubling the
# braces (run-recipe.py runs the command through str.format()).
#
# Why this is a separate recipe rather than a flag on the two native-context
# ones: every open-source framework implements *static* YaRN, so the scaling
# factor applies to every request regardless of length. Short prompts are
# embedded with a 4x-stretched position basis they were never trained on, which
# costs quality on the great majority of requests. Qwen's card says as much:
# "potentially impacting performance on shorter texts." Only run this recipe
# when a task actually exceeds the native 262,144-token window.
#
# Deviations from qwen3.8-27b-nvfp4.yaml:
#   - max_model_len 1048576 = 4.0 x 262144, matching the rope "factor" exactly.
#     The card writes 1000000; the power-of-two figure is the same setting
#     stated without rounding.
#   - max_num_seqs 8, same as the base recipe. This was 4 on the reasoning that
#     a full-length sequence costs ~32 GiB of KV (16 full-attention layers x 2 x
#     4 KV heads x 256 head dim x 1 byte) so the pool holds about four of them.
#     That is true only if every request is actually 1M tokens long; real
#     traffic is nowhere near it, and the cap was costing most of the machine's
#     capacity. Measured aggregate throughput at concurrency 8 went from 81.7 to
#     141.6 tok/s (+73%) with the KV pool essentially unchanged. vLLM preempts
#     and recomputes if genuinely oversubscribed, which is the correct failure
#     mode for a rare case rather than a permanent 73% tax on the common one.
#   - gpu_memory_utilization 0.88, up from 0.82. vLLM's own boot log offered
#     --kv-cache-memory=93.79 GiB against the 82.98 GiB in use. Taking it
#     measured 5,453,845 KV tokens against 4,997,535 (+9.1%) with no OOM and
#     decode unchanged.
#   - max_num_batched_tokens 16384 bounds the chunked-prefill activation
#     footprint, which matters far more at 1M than at 262k.
#   - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 is required: the checkpoint declares
#     max_position_embeddings 262144, and vLLM refuses a longer max_model_len
#     without it.
#
# This recipe carries no speculative decoding at all, which is the one place it
# diverges sharply from the two native-context recipes.
#
# Past the native 262,144-token window the MTP head accepts *nothing* -
# acceptance length 1.00, per-position rates 0.000/0.000/0.000, against 3.12 at
# 254,652 tokens - 0 accepted out of 246 drafted, not merely degraded - so every
# step beyond 262k paid for three sequential drafter passes and kept none of
# them. The cause is unexplained; see the measurement block above for why the
# obvious YaRN explanation does not hold. Measured decode at 287,519
# tokens: 8.5 tok/s with speculation, 14.4 without (+69%). Removing the drafter
# also returns ~7% of the KV pool.
#
# Below 262k speculation is still worth +28% to +47%, so this is a deliberate
# trade against this recipe's actual purpose: it exists to serve contexts past
# the native window, and short-context work belongs on qwen3.8-27b-nvfp4.yaml,
# which does it at 35-39 tok/s rather than this recipe's 25.
#
# FlashInfer stays as the attention backend, and unlike on the native-context
# recipes that is not a default left unexamined. Measured on this exact recipe,
# FlashInfer against TRITON_ATTN:
#
#                        FlashInfer   TRITON_ATTN
#   decode @   1,510 tok    25.6         35.9      Triton +40%
#   decode @ 213,574 tok    22.8         12.2      Triton -46%
#   decode @ 287,519 tok     8.5          3.6      Triton -58%
#   prefill @ 100,578 tok  1,623 tok/s  1,054      Triton -35%
#   TTFT    @ 213,574 tok    178 s        329 s    Triton +85%
#
# Triton is much faster at short context and much slower at long context: step
# time grows ~0.83 ms per 1k tokens of context against FlashInfer's ~0.11, and
# the two cross near 42k tokens. A recipe whose whole purpose is long context
# wants the backend on the right side of that crossover. Two further reasons
# point the same way here: with no drafter there is no multi-token verify step,
# so the CUDA-graph argument that governs the native-context recipes does not
# apply at all, and prefill dominates the wall clock at these lengths.
#
# Note the A/B above was run with speculation still enabled, so it measures the
# backends against each other rather than the exact configuration this recipe
# now ships. The depth and prefill gaps are wide enough, and the CUDA-graph
# argument for Triton disappears entirely without a drafter, that removing
# speculation can only widen FlashInfer's lead here.
#
# Measured on the 2x Spark cluster 2026-08-20, this exact recipe:
#   - GPU KV cache size 4,989,721 tokens, 4.76x concurrency at 1,048,576 per
#     request. Higher than the base recipe's 4.37M because max_num_batched_tokens
#     16384 shrinks the activation reserve.
#   - Engine init 143 s (compilation 68 s).
#   - Prefill is the cost that matters. The first figures here (107,702 tokens
#     at ~1,393 tok/s, 323,078 at ~1,159 tok/s) were measured with prompts that
#     were nested prefixes of one another, so they scored partly against a warm
#     prefix cache - the server reported a 19.3% hit rate on a supposedly cold
#     prefill. Re-measured with per-size salted prompts: 25,140 tokens at
#     2,156 tok/s, 100,578 at 1,623 tok/s, 420,571 at 845 tok/s (497.8 s).
#     Extrapolating that decay, a cold full-length 1M prefill is on the order of
#     30 minutes, not the 15-18 first estimated. Prefix caching is what makes a
#     long session bearable; a cold one is firmly a batch job.
#   - max_num_seqs was the ceiling on aggregate throughput, not memory:
#     22.6 / 37.1 / 82.6 / 81.7 tok/s aggregate at concurrency 1 / 2 / 4 / 8 with
#     the old cap of 4. Raising it to 8 gives 23.1 / 37.9 / 83.0 / 141.6.
#   - The 323k request also confirms YaRN is doing its job past the native
#     262,144-token limit.
#   - Decode barely cares about context depth, right up until it falls off a
#     cliff. Measured decode, 128 tokens generated after a cold prefill:
#         1,510 tok context ....... 25.6 tok/s   acceptance 3.x
#        25,143 .................. 26.7 tok/s   acceptance 3.x
#       100,581 .................. 25.2 tok/s   acceptance 3.x
#       213,574 .................. 22.8 tok/s   acceptance 3.00
#       254,652 .................. 23.0 tok/s   acceptance 3.12
#       287,519 ................... 8.5 tok/s   acceptance 1.00  <- past native
#       328,574 ................... 8.3 tok/s   acceptance 1.00
#
#     The cliff sits exactly on the native 262,144 boundary, and it is not a
#     bandwidth effect: past that point the MTP head accepts *nothing*
#     (per-position rates 0.000 / 0.000 / 0.000, against 0.93 / 0.68 / 0.51 at
#     254k). Not merely degraded - 0 accepted out of 246 drafted. So every step
#     past 262k pays for three drafter passes and keeps none of them.
#
#     The cause is NOT established. The obvious story - that YaRN reaches the
#     base model but not the draft head - is wrong: for method=mtp vLLM sets
#     draft_model_config = target_model_config, so the head is the target
#     checkpoint and shares one rope config. Nor is the base model extrapolating
#     at 287k; with factor 4.0 that maps to ~72k in the original basis. What is
#     known is that the head still runs and emits tokens, and the target rejects
#     every one. Exactly zero rather than merely low points at something
#     categorical - invalid position indexing, a clamped rotary cache - rather
#     than quality decay, but that is a hypothesis, not a finding.
#
#     Whatever the cause, it is awkward for this recipe specifically, since its
#     whole purpose is contexts beyond 262,144 - exactly where its speculation
#     is pure overhead. Measured with --speculative_config.* removed: 14.4 tok/s
#     at 287,519 against 8.5 with it, at the cost of the 28-47% speculation buys
#     below the boundary.
#
# The served name is qwen3.8-27b-1m, not the qwen3.8-27b the two native-context
# recipes share. A served name should distinguish what changes the client's
# contract and nothing else: the context window does - 262,144 against
# 1,048,576, and a client has to be configured for it - while the drafter does
# not, since MTP and DSpark take byte-identical requests. That is also why the
# native pair keeps one shared name: swapping between them stays a systemctl
# stop/start with no client change. Only one service binds port 8000, so
# whichever recipe is not running 404s on its name.
#
# Everything else - sampling from the checkpoint's generation_config.json, the
# multimodal limits, the parsers, and leaving FlashInfer autotune at vLLM's
# default - matches qwen3.8-27b-nvfp4.yaml.

recipe_version: "1"
name: Qwen3.8-27B-NVFP4-MTP-1M
description: vLLM serving unsloth/Qwen3.8-27B-NVFP4 with the MTP head and a 1M context via YaRN

model: unsloth/Qwen3.8-27B-NVFP4
container: vllm-node

cluster_only: false
solo_only: false

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.88
  max_model_len: 1048576
  max_num_seqs: 8
  max_num_batched_tokens: 16384

env:
  CUTE_DSL_ARCH: "sm_121a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

command: |
  vllm serve unsloth/Qwen3.8-27B-NVFP4 \
    --served-model-name qwen3.8-27b-1m \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --hf-overrides '{{"text_config": {{"rope_parameters": {{"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}}}}' \
    --enable-prefix-caching \
    --limit-mm-per-prompt '{{"image": 4, "video": 1}}' \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml
