# Recipe: qwen36-27b-fp8-mtp-dual
# Dual DGX Spark / Ray / RoCE profile for Qwen3.6-27B FP8

recipe_version: "1"
name: Qwen3.6-27B-FP8-DualSpark-MTP
description: vLLM serving Qwen3.6-27B-FP8 on two DGX Sparks with Qwen MTP speculative decoding

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.6-27B-FP8

cluster_only: true
solo_only: false

container: vllm-node

mods:
- mods/fix-qwen3.6-enhanced-chat-template

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_batched_tokens: 16384
  max_num_seqs: 8

env:
  NCCL_IB_DISABLE: "0"
  NCCL_IB_HCA: "rocep1s0f0,roceP2p1s0f0"
  NCCL_SOCKET_IFNAME: "enp1s0f0np0"
  GLOO_SOCKET_IFNAME: "enp1s0f0np0"
  NCCL_DEBUG: "INFO"
  NCCL_IGNORE_CPU_AFFINITY: "1"

command: |
  vllm serve Qwen/Qwen3.6-27B-FP8 \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --load-format fastsafetensors \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --chat-template fixed_chat_template.jinja \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend ray \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --speculative-config '{{"method":"qwen3_next_mtp","num_speculative_tokens":3}}' \
    --override-generation-config '{{"temperature":0.2,"top_p":0.90,"top_k":20,"presence_penalty":0.0,"repetition_penalty":1.0}}' \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --attention-backend flash_attn
