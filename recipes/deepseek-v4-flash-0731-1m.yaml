# Recipe: DeepSeek V4 Flash 0731 - pinned 1M context
# DeepSeek V4 Flash using the B12X-optimized serving stack on an SM121 cluster
#
# Deviations from the official DGX Spark profile (recipes.vllm.ai,
# hardware=dgx_spark_gb10, nodes=2, image eugr/spark-vllm-b12x:latest):
#
#   tensor_parallel 4 (official profile is nodes=2) - cluster moved to 4x
#     Sparks over a CRS812 switch, 2026-08-29. Override with --tp 2 to run
#     on a two-node subset.
#   --max-model-len 1048576 - the value official takes implicitly by omitting
#     the flag; stating it makes a shortfall a boot failure instead of a
#     silently shorter window.
#   max_num_seqs 16 / max_cudagraph_capture_size 128 (official 8 / 64) -
#     fleet scheduling for concurrent agent sessions.
#   --served-model-name deepseek-v4-flash-0731-1m - client-facing id so a
#     1,048,576-token window is distinguishable from the base recipe's on the
#     same port.
#   --ssl-keyfile / --ssl-certfile - fork-wide policy from PR #2, supplied by
#     the launcher; every recipe here serves TLS.
#   mods/instanttensor-hybrid-draft-loader - inherited from the base recipe;
#     untested off.
#
# Evidence, measured behaviour, tuning history (do NOT re-run those
# campaigns), benchmark traps, and known risks:
#
#   docs/tuning/deepseek-v4-flash-0731-1m.md
#
# Record new measurement campaigns in that file, not in this header.
#
recipe_version: "1"
name: DeepSeek-V4-Flash-0731-1M
description: DeepSeek-V4-Flash-0731 on a 4x Spark cluster at a pinned 1,048,576-token context

model: deepseek-ai/DeepSeek-V4-Flash-0731
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods:
  - mods/instanttensor-hybrid-draft-loader
#   - mods/drop-caches

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.85
  max_model_len: 1048576
  block_size: 256
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 128
  num_speculative_tokens: 5

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
      --host {host} \
      --port {port} \
      --served-model-name deepseek-v4-flash-0731-1m \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}'
