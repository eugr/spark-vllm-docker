# Inkling 2 Mini with full Humming MXFP8 dense projections + quantized DFlash2 on one DGX Spark.
# Fastest tested single-Spark configuration: quantizes DFlash2 (NVFP4 lm_head + MXFP8 backbone),
# enables Humming MXFP8 on the 4 coda MoE layers with cached W4A4 alignment, quantizes target
# dense attention projections and lm_head to block-32 MXFP8 W8A16, and uses sparse prefill graphs.
recipe_version: "1"
name: Inkling 2 Mini DFlash2 MXFP8
description: Fastest single-Spark Inkling 2 Mini config with Humming MXFP8 dense/coda kernels, quantized DFlash2, and sparse prefill CUDA graphs

model: thinkingmachines/Inkling-2-Mini
container: vllm/vllm-openai@sha256:c2dc759f5984f69c1e2418c6af7c26eb756f5ed2a8934c768ae1253645d1449e
pull_image: true
solo_only: true

mods:
  - mods/inkling2-dflash2
  - mods/inkling2-perf-opt

env:
  INKLING2_OPT_MOE: "mxfp8_only"
  INKLING2_OPT_DFLASH_LMHEAD: "nvfp4"
  INKLING2_OPT_DFLASH_BACKBONE: "mxfp8"
  INKLING2_OPT_TARGET_DENSE: "mxfp8_all"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  max_model_len: 262144
  gpu_memory_utilization: 0.8

command: |
  vllm serve thinkingmachines/Inkling-2-Mini \
    --revision c9d028302cd0f035fdf8e7e91f089a4ce94d2195 \
    --tokenizer-revision c9d028302cd0f035fdf8e7e91f089a4ce94d2195 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --reasoning-parser inkling \
    --enable-auto-tool-choice \
    --tool-call-parser inkling \
    --moe-backend humming \
    --compilation-config '{{"prefill_cudagraph_capture_token_sizes":[1,2,4,8,16,24,32,48,64,96,128,192,256,384,512]}}' \
    --speculative-config '{{"method":"dflash","model":"incoai/Inkling-2-Mini-DFlash2","revision":"4f9088ea66c21f2b99ed657d1941c306b03e84d2","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}}'
