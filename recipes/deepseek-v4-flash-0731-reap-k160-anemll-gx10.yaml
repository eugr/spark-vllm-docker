name: DeepSeek-V4-Flash-0731-REAP K160 - Anemll GX10 image, single Spark + DSpark
recipe_version: "1"
description: >-
  0xSero REAP K160 (160/256 routed experts, ~108GB) on one DGX Spark/GB10 using
  the Anemll dspark-vllm-gx10 image (vLLM 0.25.x + b12x MXFP4 MoE + nvfp4_ds_mla
  KV cache + DSpark speculative decoding). Single-node TP=1 port of Anemll's
  validated two-node launch (github.com/Anemll/dspark-vllm-gx10).
container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
model: 0xSero/DeepSeek-V4-Flash-0731-REAP

# K160 is outside the fused CUDA sqrtsoftplus router's supported expert counts,
# so route it through vLLM's pure-Torch fallback (required by the model card).
# The patch target (fused_topk_bias_router.py) is verified present in this image.
mods:
  - mods/deepseek-v4-reap-gb10-official_0xsero

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.94
  max_model_len: 8192            # REAP card smoke-validated ctx; raise carefully
  max_num_seqs: 2
  max_num_batched_tokens: 262144
  max_cudagraph_capture_size: 24 # max_num_seqs * (num_speculative_tokens + 1)
  num_speculative_tokens: 3      # Anemll default; their head.env used 5

# Single-node subset of Anemll's compose environment (NCCL/IB is 2-node only).
env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_TRITON_MLA_SPARSE: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_SKIP_INIT_MEMORY_CHECK: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  DSPARK_SLOT_CLAMP: "1"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

# NOTE: literal JSON braces are doubled for str.format(). To run WITHOUT DSpark,
# delete the --speculative-config line (and optionally the DSpark env vars).
command: |
  vllm serve 0xSero/DeepSeek-V4-Flash-0731-REAP \
      --served-model-name deepseek-v4-flash-reap-k160 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --pipeline-parallel-size 1 \
      --kv-cache-dtype fp8 \
      --block-size 256 \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --async-scheduling \
      --enable-chunked-prefill \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic"}}' \
      --tokenizer-mode deepseek_v4 \
      --moe-backend flashinfer_b12x \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}}' \
      --default-chat-template-kwargs '{{"thinking":false}}' \
      --generation-config vllm \
      --enable-flashinfer-autotune
