# Recipe: Qwen3.8-27B-NVFP4 with the separate DSpark draft model
# Same target checkpoint as qwen3.8-27b-nvfp4.yaml, drafted by a 5-layer DSpark
# speculator instead of the in-checkpoint MTP head. Higher single-stream
# throughput, so it suits agent loops and single-user sessions; the drafter's
# weights and cache come out of the same memory budget, which costs KV pool.
# Download both checkpoints before launching.
#
# Source: https://gist.github.com/Mirrdhyn/d476d17723c9d68eac72f03ec9447f2b
#   "Qwen3.8-27B-NVFP4 + MTP on a single DGX Spark - recipe, method, benchmarks"
#
# Deviations from that gist's launch block, both taken from its own
# "Appendix: TP=2 on two Sparks":
#   - tensor_parallel defaults to 2; the gist's block is TP=1. Decode is
#     bandwidth-bound on this dense checkpoint, so splitting the 22 GB weight
#     read gave +65% decode and 2.15x the KV pool. --solo forces TP=1.
#   - --no-enable-flashinfer-autotune replaces the gist's
#     --enable-flashinfer-autotune. Autotune is harmless at TP=1 but deadlocks
#     engine startup at TP=2 on multi-node hosts without GPUDirect, with no
#     error - just a once-a-minute shm_broadcast timeout
#     (vllm-project/vllm#52291, filed on this hardware).
#
# Everything else matches the gist, including the deliberate omission of
# --generation-config vllm: the checkpoint's own generation_config.json carries
# Qwen's recommended sampling, and overriding it drops top_k entirely.
#
# One further deviation, specific to this recipe: the gist's DSpark launch block
# reads "...same flags as above...", i.e. --gpu-memory-utilization 0.82. This
# recipe uses 0.80, the value its FP8-vs-NVFP4 appendix ran DSpark k=7 at - the
# only utilization the gist actually measured with this drafter. The drafter's
# own weights and cache come out of the same budget, costing KV pool: 3.04M
# tokens against 4.37M with the in-checkpoint MTP head.

recipe_version: "1"
name: Qwen3.8-27B-NVFP4-DSpark
description: vLLM serving unsloth/Qwen3.8-27B-NVFP4 with the Doopeworld DSpark draft model

model: unsloth/Qwen3.8-27B-NVFP4
container: vllm-node

cluster_only: false
solo_only: false

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  max_model_len: 262144
  max_num_seqs: 8
  num_speculative_tokens: 7

env:
  CUTE_DSL_ARCH: "sm_121a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_FLASHINFER_SAMPLER: "1"

command: |
  vllm serve unsloth/Qwen3.8-27B-NVFP4 \
    --served-model-name qwen3.8-27b \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --limit-mm-per-prompt '{{"image": 4, "video": 0}}' \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --no-enable-flashinfer-autotune \
    --speculative_config.method dspark \
    --speculative_config.model Doopeworld/Qwen3.8-27B-DSpark-vLLM \
    --speculative_config.num_speculative_tokens {num_speculative_tokens} \
    --speculative_config.draft_sample_method probabilistic
