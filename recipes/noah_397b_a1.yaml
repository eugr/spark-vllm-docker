# Recipe: Noah 397B — A1 ARTIFACT TEST
# Same topology as A0. Single change from A0: switch from Intel's AutoRound
# checkpoint to the official Qwen GPTQ-Int4 artifact.
#
# Purpose:
#   If A0 still fails, isolate whether the failure is primarily the model
#   artifact/packing path rather than the TP topology.
#
# Topology (unchanged from A0):
#   - TP=1
#   - DP=4
#   - --data-parallel-backend ray
#   - --enable-expert-parallel
#   - VLLM_RAY_DP_PACK_STRATEGY=span
#   - no fix-qwen35-tp4-marlin
#
# Single change from A0:
#   - model: Intel/Qwen3.5-397B-A17B-int4-AutoRound
#       -> Qwen/Qwen3.5-397B-A17B-GPTQ-Int4
#
# Intended launch: 4 total nodes (1 head + 3 workers), 1 GPU per node.
# Launch example:
#   ./run-recipe.sh recipes/noah_397b_a1.yaml -n IP1,IP2,IP3,IP4
#
# Confirmer:
#   - same topology flags as A0 appear in startup log
#   - determine_available_memory completes
#   - Uvicorn running on http://0.0.0.0:9000
#
# Falsifier:
#   - same class of kernel crash under TP=1 + DP=4 + EP

recipe_version: "1"
name: noah-397b-a1
description: Noah 397B A1 — official Qwen GPTQ-Int4 on TP=1 DP=4 EP

cluster_only: true
container: vllm-node-noah-patched

mods:
  - mods/gpu-mem-util-gb
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 9000
  host: 0.0.0.0
  tensor_parallel: 1
  data_parallel: 4
  gpu_memory_utilization: 80
  max_model_len: 16384
  max_num_batched_tokens: 1024

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_FLASHINFER_MOE_FP4: "0"
  VLLM_DISABLED_KERNELS: "MarlinLinearKernel,GPTQMarlinLinearMethod"
  VLLM_RAY_DP_PACK_STRATEGY: "span"

command: |
  vllm serve Qwen/Qwen3.5-397B-A17B-GPTQ-Int4 \
    --max-model-len {max_model_len} \
    --max-num-seqs 2 \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization-gb {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enforce-eager \
    --skip-mm-profiling \
    --data-parallel-size {data_parallel} \
    --data-parallel-backend ray \
    --enable-expert-parallel \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template unsloth.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
