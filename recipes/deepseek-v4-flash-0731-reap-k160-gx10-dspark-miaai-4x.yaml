# Recipe: DeepSeek-V4-Flash-0731 REAP K160 on GB10 — MiaAI-Lab single-node,
#         160K-context / 4-concurrent profile.
#
# Port of .env.160k4x (+ docker-compose.single.yml) from
#   DeepSeek-v4-Flash-DSpark-2x-DGX-Spark/  (single-node adaptation of
#   MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark for one DGX Spark / GB10).
#
# PROFILE (from the .env, bumped 160K->176K per request):
#   4 concurrent requests at 176K ctx each. KV cache is fp8 (NOT nvfp4_ds_mla).
#   The .env estimated ~715K fp8 KV tokens at util 0.95 -> /4 = ~178K per stream,
#   which cleared 160K comfortably but only ~marginally clears 176K (180224).
#   If 4x full 176K OOMs the KV pool: raise gpu_memory_utilization, drop
#   max_num_seqs to 3, or lower max_model_len. UNVERIFIED on hardware.
#
# Both compose prelude patches are reproduced as mods:
#   - deepseek-v4-reap-gb10-official_0xsero : K160 router fallback
#     (patch_vllm_router_k160.py — nonstandard expert count -> Torch router).
#   - deepseek-v4-dsv4-encoding-low : the DSPARK_ENCODING_FILE branch. This env
#     SETS DSPARK_ENCODING_FILE, so the compose installed REAP's own
#     encoding_dsv4.py and remapped reasoning_effort "low" -> "low" (stock maps
#     it to "high"). The mod auto-discovers the encoder in the HF cache, so
#     DEFAULT_THINKING=low below actually serves at low effort.
#
# Two-node vars (NODE_RANK/HEADLESS/MASTER_*/NCCL_NET/NVLS/CUMEM) are
# launch-managed here and dropped; only NCCL_IB_DISABLE is kept (harmless solo).
# UNTESTED end-to-end — knobs carried verbatim from the .env; flags verified
# against the sibling native recipe known-good for this exact image.

recipe_version: "1"
name: DeepSeek-V4-Flash-0731-REAP-K160-GX10-DSpark-MiaAI-160K4x
description: >-
  0xSero/DeepSeek-V4-Flash-0731-REAP (REAP K160, MXFP4 experts) on one DGX
  Spark GB10 via Anemll dspark-vllm-gx10:0.1.1, ported from MiaAI-Lab's
  .env.160k4x: 4 concurrent streams at 176K context each, native DSpark
  spec-decode (k=7, greedy), flashinfer_b12x MoE, fp8 KV cache, thinking=low.

model: 0xSero/DeepSeek-V4-Flash-0731-REAP
container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1

mods:
  - mods/deepseek-v4-reap-gb10-official_0xsero
  - mods/deepseek-v4-dsv4-encoding-low

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.945
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 4120     # 8192 + max_num_seqs*(num_spec+1) = 8192 + 4*8
  max_cudagraph_capture_size: 32   # max_num_seqs * (num_speculative_tokens + 1) = 4 * 8
  num_speculative_tokens: 7        # checkpoint dspark_block_size=5, so k>=5; 7 valid
  kv_cache_type: "fp8"              # was nvfp4_ds_mla; fp8 = same KV capacity, higher precision

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "0"
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "60000"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_B12X_MOE: "1"
  VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "0"
  VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "16"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  CUTE_DSL_ARCH: "sm_121a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  TILELANG_CLEANUP_TEMP_FILES: "1"
  DG_JIT_USE_NVRTC: "0"
  DG_JIT_NVCC_COMPILER: "/usr/local/cuda/bin/nvcc"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  NCCL_IB_DISABLE: "1"

# literal JSON braces are doubled for str.format(). Delete --speculative-config
# to run WITHOUT DSpark. To change thinking, edit --default-chat-template-kwargs
# (off: {{"thinking":false}} ; high/max: reasoning_effort high|max).
command: |
  vllm serve 0xSero/DeepSeek-V4-Flash-0731-REAP \
      --served-model-name deepseek-v4-flash-0731-reap-k160 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --pipeline-parallel-size 1 \
      --kv-cache-dtype {kv_cache_type} \
      --block-size 256 \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-prompt-tokens-details \
      --async-scheduling \
      --enable-chunked-prefill \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"greedy"}}' \
      --tokenizer-mode deepseek_v4 \
      --moe-backend flashinfer_b12x \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}}' \
      --default-chat-template-kwargs '{{"thinking":true,"reasoning_effort":"low"}}' \
      --generation-config vllm \
      --enable-flashinfer-autotune
