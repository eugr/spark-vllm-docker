# Recipe: Noah 397B (Intel/Qwen3.5-397B-A17B-int4-AutoRound)
# Uses pre-patched image: vllm-node-noah-patched:latest
# Baked: install-conch (1.3), fix-qwen35-tp4-marlin (TP=4 Marlin fix)
# Runtime mods applied at launch:
#   - gpu-mem-util-gb: adds --gpu-memory-utilization-gb flag (bypasses fraction check)
#                      patch applies cleanly (not baked)
#   - fix-qwen3.5-chat-template: copies unsloth.jinja to /workspace
#
# TP=2 IS NOT VIABLE: 98.24 GiB weights/node + ~4 GiB NCCL overhead = 102+ GiB profiling peak
#   on 121 GiB nodes. Budget ≥ 103 GiB → kernel panic (kcompactd Driver 590 UMA bug).
#   Budget < 103 GiB → no KV cache. No viable budget exists for TP=2.
#
# Memory math (TP=4, ARK-4+ARK-6+ARK-7+ARK-8, 121.69 GiB total, ~109-112 GiB free):
#   Weights per node (TP=4, fp4): ~49.12 GiB
#   Ray + NCCL overhead: ~15 GiB → init_device sees ~96 GiB free
#   gpu_memory_utilization_gb=80: requested=80 < 96+0.5 GiB ✓
#   Kernel headroom: 121 - (25 overhead + 80 vLLM) = ~16 GiB ✓ (very safe)
#   Profiling peak estimate: ~55 GiB → KV available: 80-55 = ~25 GiB ✓

recipe_version: "1"
name: noah-397b
description: Noah 397B - Intel Qwen3.5-397B-A17B-int4-AutoRound (patched image)

cluster_only: true

container: vllm-node-noah-patched

mods:
  - mods/fix-qwen35-tp4-marlin
  - mods/gpu-mem-util-gb
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 9000
  host: 0.0.0.0
  tensor_parallel: 4
  # Absolute GiB (via gpu-mem-util-gb mod): 80 GiB per node, ~16 GiB kernel headroom
  gpu_memory_utilization: 80
  max_model_len: 16384
  max_num_batched_tokens: 1024

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_FLASHINFER_MOE_FP4: "0"
  VLLM_DISABLED_KERNELS: "MarlinLinearKernel,GPTQMarlinLinearMethod"

command: |
  vllm serve Intel/Qwen3.5-397B-A17B-int4-AutoRound \
    --max-model-len {max_model_len} \
    --max-num-seqs 2 \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization-gb {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enforce-eager \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template unsloth.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
