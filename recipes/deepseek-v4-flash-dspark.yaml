# Recipe: DeepSeek V4 Flash DSpark C12 NVFP4
# DSpark speculative decoding + NVFP4 KV cache on 2x DGX Spark (GB10)
#
# Based on tonyd2wild's verified C12 NVFP4 profile (2026-07-04).
# https://github.com/tonyd2wild/DeepSeek-v4-Flash-DSpark-1M-NVFP4-KV-2x-DGX-Spark
#
# Key community sources:
#   - tonyd2wild C12 NVFP4 default config (canonical 350K verified profile)
#   - MiaAI-Lab DSpark concurrency patch (Keys C12)
#   - 0rand, renek: DSpark cold-start garble root cause analysis
#   - Aiden Le: production-3.2 image reference, fp8 fallback guidance
#
# The DSpark speculative decode garble fix (probabilistic draft, graph-capture
# sizing, async-scheduling, chunked-prefill) is incorporated — see the AGENT_GARBLE_FIX
# discussion in tonyd2wild's repo for the full diagnosis.
#
# Requires:
#   - build-and-copy.sh with --apply-vllm-pr 46995 (DSpark PR)
#   - mods/deepseek-v4-flash-dspark mod for overlay files + NVFP4 patches
#   - Two-node cluster (back-to-back or switch), user apollo11
#   - Model cached at ~/.cache/huggingface (see prepare-dspark-model-cache.sh)
#
# Usage:
#   ./run-recipe.py deepseek-v4-flash-dspark --solo              # single node debug
#   ./run-recipe.py deepseek-v4-flash-dspark                     # 2-node cluster
#
# Build flags (pass before recipe name):
#   ./run-recipe.py --build-args "--apply-vllm-pr 46995" deepseek-v4-flash-dspark
#
# Uses HF repo ID for model resolution via HF_HOME at container runtime.
# The model cache at ~/.cache/huggingface is bind-mounted into the container.

recipe_version: "1"
name: DeepSeek-V4-Flash-DSpark
description: "DeepSeek V4 Flash DSpark C12 NVFP4 — DSpark spec decode, NVFP4 KV cache, B12X MoE on 2x DGX Spark"

model: fraserprice/DeepSeek-V4-Flash-DSpark
container: vllm-dspark-runtime:dspark-nvfp4-stage-c

# Two-node cluster required (back-to-back or switch)
cluster_only: true

# DSpark overlay mod — copies overlay files + runs NVFP4 patches at container start
mods:
  - mods/deepseek-v4-flash-dspark

# Default settings (override via CLI)
# Community-verified (tonyd2wild C12 NVFP4, 2026-07-04): gpu_mem=0.80,
# max_model_len=350000, seqs=12, btokens=8192, spec_tokens=5.
# Gigabyte Atom (DGX Spark head, less free GPU mem): use gpu_mem=0.77,
# max_model_len=450000 to account for lower available memory (~94 GiB free
# vs ~103 GiB on a clean Spark).
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  model: fraserprice/DeepSeek-V4-Flash-DSpark
  gpu_memory_utilization: 0.77
  max_model_len: 350000
  block_size: 256
  max_num_seqs: 12
  max_num_batched_tokens: 8192
  num_speculative_tokens: 5
  kv_cache_dtype: nvfp4_ds_mla

# Environment variables — DSpark + B12X + NVFP4 config
# Set HF_HOME to match the container's HF cache bind mount path.
env:
  HF_HOME: "/root/.cache/huggingface"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_XET: "1"
  VLLM_CACHE_ROOT: "/root/.cache/huggingface/vllm-cache"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_DSPARK_CONFIDENCE_THRESHOLD: "0.0"
  VLLM_DSPARK_CONFIDENCE_SCHEDULER: "off"
  VLLM_DSPARK_LOCAL_ARGMAX: "1"
  VLLM_DSPARK_REPLICATE_MARKOV_W1: "1"
  VLLM_DSPARK_FUSED_MARKOV_ARGMAX: "0"
  VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: "1"
  VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT: "0"
  VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP: "1"
  VLLM_DSV4_B12X_COMPRESSED_MLA: "0"
  VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE: "0"
  VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT: "0"
  VLLM_TRITON_MLA_SPARSE: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_SKIP_INIT_MEMORY_CHECK: "1"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  TILELANG_CLEANUP_TEMP_FILES: "1"
  NCCL_NET: "IB"
  NCCL_IB_DISABLE: "0"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_NVLS_ENABLE: "0"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

# The vLLM serve command template
# Note: --nnodes, --node-rank, --master-addr, --master-port, --headless are
# automatically appended by launch-cluster.sh in cluster mode.
command: |-
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size 1 \
    --kv-cache-dtype {kv_cache_dtype} \
    --block-size {block_size} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-cudagraph-capture-size {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --async-scheduling \
    --enable-chunked-prefill \
    --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic"}}' \
    --tokenizer-mode deepseek_v4 \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
    --default-chat-template-kwargs '{{"thinking":false}}' \
    --generation-config vllm \
    --enable-flashinfer-autotune \
    --distributed-executor-backend mp \
    --served-model-name deepseek-v4-flash-dspark
