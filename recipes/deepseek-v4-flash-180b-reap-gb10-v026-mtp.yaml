# Recipe: DeepSeek-V4-Flash-180B REAP on GB10 — vLLM v0.26.0, MTP speculative
#
# New recipe, not derived from deepseek-v4-flash-180b-reap-gb10-tuned.yaml.
# That recipe runs on the pre-built `eugr-spark-vllm-deepseek-v4-reap-gb10`
# image (vLLM version unpinned/baked-in). This one pins vLLM explicitly via
# --vllm-ref (same pattern as recipes/laguna-s-2.1-nvfp4-dflash.yaml) so the
# build is reproducible and trackable against upstream vLLM releases.
#
# Reuses mods/deepseek-v4-reap-gb10 (router fallback for nonstandard REAP
# expert counts, MXFP4 per-layer memory hygiene, cutedsl override, FlashInfer
# CUDA IPC libcudart fix) — those patches target the DeepSeek-V4 MXFP4 MoE
# code path, which is unlikely to have moved between the version the mod was
# written against and v0.26.0, but patch_vllm_reap_gb10.py fails loudly
# (PATCH_TARGET_NOT_FOUND / PATCH_TARGET_NOT_UNIQUE) rather than silently
# applying to the wrong lines, so a first-boot failure here means the patch
# needs re-anchoring for this vLLM version, not that something is silently
# broken.
#
# container renamed vllm-node -> vllm-node-v026: the generic `vllm-node` tag was
# already built (at vLLM 0.23.1rc1.dev, shared with eugr-spark-vllm-deepseek-v4-reap-gb10
# and minimax-m2.7-reap-139b), so --vllm-ref v0.26.0 was silently skipped on
# first run (check_image_exists saw the tag as already present). Any recipe
# reusing "vllm-node" as container with its own --vllm-ref has this same bug
# unless --force-build is passed every time.
#
# max_model_len kept at the empirically-safe 163840 ceiling from the tuned
# recipe's live metrics review — raise it only after confirming this vLLM
# version doesn't regress the REAP MoE memory hygiene fix.

recipe_version: "1"
name: DeepSeek-V4-Flash-180B-REAP-GB10-v026-MTP
description: >-
  vLLM v0.26.0 (built from source via --vllm-ref) serving
  0xSero/DeepSeek-V4-Flash-180B (REAP K160, MXFP4 experts, FP8 MLA KV) on a
  single DGX Spark GB10 node, with MTP speculative decoding.

model: 0xSero/DeepSeek-V4-Flash-180B
# container pinned to the eugr-spark-vllm-deepseek-v4-reap-gb10:0.26-dgfix
# rebuild (same vLLM 568afb3a1 / DeepGEMM f8e8fb583 commits as vllm-node-v026,
# just a fresh build) rather than vllm-node-v026 directly: 180B on
# vllm-node-v026 hit the identical DeepGEMM UE8M0 warmup assertion
# (smxx_layout.cuh:131) that 162B hit, whereas this exact tag has an actual
# confirmed-working 180B run (fix-git terminal-bench task, reward 1.00) behind it.
container: eugr-spark-vllm-deepseek-v4-reap-gb10:0.26-dgfix

mods:
  - mods/deepseek-v4-reap-gb10-v026

defaults:
  port: 8000
  host: 0.0.0.0
  gpu_memory_utilization: 0.94
  max_model_len: 262144
  max_num_seqs: 2
  max_num_batched_tokens: 4096
  num_speculative_tokens: 3

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "10000"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  TILELANG_CLEANUP_TEMP_FILES: "1"
  DG_JIT_USE_NVRTC: "0"
  DG_JIT_NVCC_COMPILER: "/usr/local/cuda/bin/nvcc"
  NCCL_IB_DISABLE: "1"
  NCCL_DEBUG: "WARN"
  K160_DISABLE_CUTEDSL: "0"
  CUTEDSL_VERSION: ""
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"

command: |
  vllm serve 0xSero/DeepSeek-V4-Flash-180B \
    --served-model-name deepseek-v4-flash-REAP-180B-v026 \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size 1 \
    --pipeline-parallel-size 1 \
    --moe-backend marlin \
    --kv-cache-dtype fp8 \
    --block-size 256 \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --distributed-executor-backend mp \
    --tokenizer-mode deepseek_v4 \
    --load-format safetensors \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}}' \
    --default-chat-template-kwargs '{{"thinking":true}}' \
    --default-chat-template-kwargs.reasoning_effort=high \
    --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
    --disable-access-log-for-endpoints /health,/metrics,/ping
