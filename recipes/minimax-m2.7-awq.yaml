# Recipe: MiniMax-M2.7-AWQ
# MiniMax M2.7 model with AWQ quantization

recipe_version: "1"
name: MiniMax-M2.7-AWQ
description: vLLM serving MiniMax-M2.7-AWQ on a multi-node cluster

# HuggingFace model to download (optional, for --download-model)
model: cyankiwi/MiniMax-M2.7-AWQ-4bit

# Container image to use
container: vllm-node

# Can only be run in a cluster
cluster_only: true

# No mods required
mods: []

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  # 0.85: at 0.8 the KV cache (~22.5 GiB) is below the ~23.25 GiB needed for
  # 196608 tokens on 2x Spark, since CUDA-graph memory profiling (vLLM >= 0.21)
  # lowers the effective budget. 0.85 gives ~28.7 GiB (~240k tokens).
  gpu_memory_utilization: 0.85
  max_model_len: 196608

# Environment variables
env: {}

# The vLLM serve command template
command: |
  vllm serve cyankiwi/MiniMax-M2.7-AWQ-4bit \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend ray \
      --max-model-len {max_model_len} \
      --load-format instanttensor \
      --enable-auto-tool-choice \
      --tool-call-parser minimax_m2 \
      --reasoning-parser minimax_m2
