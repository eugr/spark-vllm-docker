# Recipe: Noah 397B — H1 VALIDATION RUN
# Inherits baseline from noah-397b.yaml. Single change: adds fix-qwen35-tp4-marlin.
#
# Hypothesis H1: replacing TP-sharded in_proj_ba (MergedColumnParallelLinear, N=32/rank)
# with ReplicatedLinear in_proj_b/in_proj_a (N=64, no TP split) eliminates
# ConchLinearKernel BLOCK_N=64 unmasked OOB scale reads → cudaErrorIllegalAddress.
#
# Single change from baseline: mods/fix-qwen35-tp4-marlin (v3) added as first mod.
# No other changes from noah-397b.yaml.
#
# Confirmer: failure disappears; load progresses beyond prior crash point;
#   no "not found in params_dict" warnings for in_proj_b.* / in_proj_a.*
# Falsifier: same cudaErrorIllegalAddress in gdn_linear_attn.py after fix confirmed applied.
#
# After run: update docs/incidents/noah_397b_experiment_ledger.md with result.
# If confirmed: promote fix-qwen35-tp4-marlin to noah-397b.yaml, then delete this file.
# If rejected: record falsifier evidence, return to Phase 1.

recipe_version: "1"
name: noah-397b-h1
description: Noah 397B H1 validation — fix-qwen35-tp4-marlin only change from baseline

cluster_only: true
container: vllm-node-noah-patched

mods:
  - mods/fix-qwen35-tp4-marlin
  - mods/gpu-mem-util-gb
  - mods/fix-qwen3.5-chat-template

defaults:
  port: 9000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 80
  max_model_len: 16384
  max_num_batched_tokens: 1024

env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_FLASHINFER_MOE_FP4: "0"
  VLLM_DISABLED_KERNELS: "MarlinLinearKernel,GPTQMarlinLinearMethod"

command: |
  vllm serve Intel/Qwen3.5-397B-A17B-int4-AutoRound \
    --max-model-len {max_model_len} \
    --max-num-seqs 2 \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization-gb {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enforce-eager \
    --skip-mm-profiling \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    --chat-template unsloth.jinja \
    -tp {tensor_parallel} \
    --distributed-executor-backend ray
