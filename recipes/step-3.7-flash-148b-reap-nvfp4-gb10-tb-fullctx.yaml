# Recipe: Step-3.7-Flash-148B-REAP-NVFP4-GB10-tb-fullctx
# MTP + 3-wide at the max context that fits 3 concurrent: 184k (188416).
# step3p5 reasoning parser + medium effort (chat-friendly). Single GB10, 0.95.
# 3x184k = 565k KV tokens; MTP pool at the ~115 GiB free ceiling is ~567-597k.

recipe_version: "1"
name: Step-3.7-Flash-148B-REAP-NVFP4-GB10-tb-fullctx
description: >-
  vLLM serving 0xSero/Step-3.7-Flash-148B (REAP NVFP4, MTP, step3p5 reasoning
  parser, medium effort) at 184k context, 3-wide, on a single DGX Spark GB10.

model: 0xSero/Step-3.7-Flash-148B
container: vllm-node

cluster_only: false
mods:
  - mods/step-3.7-flash
  - mods/step-3.7-mtp-bf16-draft

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.95
  max_model_len: 188416
  max_num_seqs: 3
  num_speculative_tokens: 3

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "10000"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  NCCL_IB_DISABLE: "1"
  NCCL_DEBUG: "WARN"
  HF_HUB_OFFLINE: "1"

command: |
  vllm serve 0xSero/Step-3.7-Flash-148B \
      --served-model-name step3p7-flash-148b \
      --trust-remote-code \
      --port {port} \
      --host {host} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --distributed-executor-backend mp \
      --quantization modelopt \
      --kv-cache-dtype fp8 \
      --disable-cascade-attn \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --enable-chunked-prefill \
      --enable-prefix-caching \
      --enable-auto-tool-choice \
      --reasoning-parser step3p5 \
      --structured-outputs-config.enable_in_reasoning=True \
      --default-chat-template-kwargs.reasoning_effort=medium \
      --tool-call-parser step3p5 \
      --load-format instanttensor \
      --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}' \
      --disable-access-log-for-endpoints /health,/metrics,/ping
