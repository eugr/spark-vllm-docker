# Recipe: Kimi K2.6 native INT4
# Guarded ARK pilot recipe. This is the only native Kimi K2.6 serving recipe;
# Qwen/Noah 397B must stay on its own explicit route.
recipe_version: "1"
name: Kimi-K2.6-Native-INT4
description: vLLM serving moonshotai/Kimi-K2.6 native INT4 on the guarded ARK-3 lane

model: moonshotai/Kimi-K2.6
container: vllm-node-kimi-pilot-rb1
cluster_only: true
solo_only: false

mods:
  - /home/novaadmin/morrisaegis-codex/scripts/vllm_mods/kimi_sm121_flashinfer_mla

env:
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_OFFLINE: "1"
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_TIMEOUT: "22"
  NCCL_IB_RETRY_CNT: "13"
  NCCL_IB_QPS_PER_CONNECTION: "1"
  NCCL_IB_MERGE_NICS: "1"
  NCCL_IB_SPLIT_DATA_ON_HCAS: "1"
  NCCL_IB_PCI_RELAXED_ORDERING: "1"
  NCCL_IB_TC: "106"
  NCCL_IB_SL: "0"
  NCCL_IB_ADAPTIVE_ROUTING: "0"
  NCCL_CROSS_NIC: "1"
  NCCL_NET_MERGE_LEVEL: "NODE"
  NCCL_NET_GDR_LEVEL: "0"
  NCCL_NET_GDR_C2C: "1"
  NCCL_PXN_C2C: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"
  NCCL_ALGO: "Ring"
  NCCL_BUFFSIZE: "4194304"
  NCCL_NTHREADS: "512"
  NCCL_MIN_NCHANNELS: "16"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_LAZY_CONNECT: "1"
  NCCL_SOCKET_RETRY_CNT: "50"
  NCCL_SOCKET_RETRY_SLEEP_MSEC: "150"
  NCCL_NET_PLUGIN: "none"
  NCCL_DEBUG: "INFO"
  NCCL_MIN_CTAS: "32"
  NCCL_SOCKET_FAMILY: "AF_INET"
  RAY_CGRAPH_get_timeout: "900"
  RAY_USAGE_STATS_ENABLED: "0"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_DISABLE_MOE_WNA16_CUDA: "1"
  VLLM_DISABLE_WNA16_MARLIN_MOE: "1"
  VLLM_NO_USAGE_STATS: "1"
  VLLM_USE_FLASHINFER_MOE_FP4: "1"

defaults:
  port: 30020
  host: 0.0.0.0
  tensor_parallel: 8
  gpu_memory_utilization: 0.76
  max_model_len: 16384
  max_num_seqs: 1

command: |
  vllm serve moonshotai/Kimi-K2.6 \
    --served-model-name moonshotai/Kimi-K2.6 \
    --kv-cache-dtype fp8 \
    --safetensors-load-strategy lazy \
    --mm-encoder-tp-mode data \
    --attention-backend TRITON_MLA \
    --skip-mm-profiling \
    --compilation_config.pass_config.fuse_allreduce_rms true \
    --enforce-eager \
    --no-async-scheduling \
    --no-enable-prefix-caching \
    --tool-call-parser kimi_k2 \
    --reasoning-parser kimi_k2 \
    --enable-auto-tool-choice \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend ray
