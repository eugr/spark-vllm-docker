# Recipe: Qwen3.8-27B-NVFP4 with the in-checkpoint MTP head
# Dense hybrid model (16 full-attention + 48 linear layers). Decode is
# bandwidth-bound, so TP=2 nearly doubles single-stream throughput and the KV
# pool. Runs on a solo Spark with --tp 1.
#
# Source: https://gist.github.com/Mirrdhyn/d476d17723c9d68eac72f03ec9447f2b
#   "Qwen3.8-27B-NVFP4 + MTP on a single DGX Spark - recipe, method, benchmarks"
#
# Deviation from that gist's launch block, taken from its own
# "Appendix: TP=2 on two Sparks":
#   - tensor_parallel defaults to 2; the gist's block is TP=1. Decode is
#     bandwidth-bound on this dense checkpoint, so splitting the 22 GB weight
#     read gave +65% decode and 2.15x the KV pool. --solo forces TP=1.
#
# FlashInfer autotune is left at vLLM's own default (on at -O2), matching five
# of eugr's six multi-node recipes. An earlier version of this recipe passed
# --no-enable-flashinfer-autotune over vllm-project/vllm#52291, a synchronized-
# autotune startup deadlock on multi-node hosts without GPUDirect. Tested on
# this cluster 2026-08-20: that deadlock cannot occur on the image we run -
# set_autotune_process_group does not exist in it, and flashinfer_autotune()
# takes the per-rank path whenever world_size > 1. Autotune completed twice,
# ~11 s tuning fp4_gemm, with single-stream decode unchanged (26.1-26.8 tok/s
# on vs 22.6-26.4 off). Revisit if a future image regresses.
#
# Attention backend, measured on this cluster 2026-08-20. Under speculative
# decoding on FlashInfer, every multi-token verify step ran outside full CUDA
# graphs and vLLM logged "CUDAGraphMode.FULL_AND_PIECEWISE is not supported
# with spec-decode for attention backend FlashInferBackend (support:
# AttentionCGSupport.UNIFORM_SINGLE_TOKEN_DECODE); setting
# cudagraph_mode=PIECEWISE". That threw away most of what speculation buys:
# ~2.7-2.8 tokens accepted per step returned only ~1.35x over no speculation.
#
# This is architectural on GB10, not a tuning mistake, so do not try to fix it
# on FlashInfer. FlashInferMetadataBuilder.get_cudagraph_support() returns
# UNIFORM_BATCH only when can_use_trtllm_attention() holds, and
# supports_trtllm_attention() ends in is_device_capability_family(100). This
# hardware is sm_121 - family 120 - so it is always False.
#
# TRITON_ATTN declares AttentionCGSupport.ALWAYS. Both flags are required:
# with only --attention-backend the drafter re-selects FlashInfer ("Using
# FLASHINFER attention backend out of potential backends") and the warning
# stays.
#
# Single-stream /v1/completions, 256 greedy tokens, TP=2:
#   no speculation ................................. 19.8 tok/s
#   DSpark k=7, FlashInfer ......................... 22.6-26.8 tok/s
#   MTP k=3, FlashInfer ............................ 26.8-27.7 tok/s
#   MTP k=8, TRITON_ATTN ........................... 28.5-29.4 tok/s
#   DSpark k=7, TRITON_ATTN ........................ 34.5 tok/s
#   MTP k=3, TRITON_ATTN ........................... 39.4-39.6 tok/s  <- best
# k=8 loses to k=3 despite higher acceptance (3.3 vs 3.0): eight sequential
# drafter passes cost more than the extra accepted tokens return.
# Everything else matches the gist, including the deliberate omission of
# --generation-config vllm: the checkpoint's own generation_config.json carries
# Qwen's recommended sampling, and overriding it drops top_k entirely.
#
# Reasoning effort needs no flag here. The served checkpoint ships Qwen's own
# chat template plus Unsloth's superset patches (a high -> xhigh alias, the
# developer role, merged leading system messages), so no --chat-template
# override is wanted; effort is a per-request setting that vLLM forwards from
# the OpenAI reasoning_effort field into chat_template_kwargs. The template
# takes xhigh (the default, and the card's), medium and low, plus high. vLLM's
# API additionally accepts minimal and max, which the template rejects with a
# 400; none is safe and simply turns thinking off.
#
# The sampling inherited from generation_config.json is Qwen's thinking-mode
# preset. Clients that turn thinking off are expected to send the card's
# instruct preset themselves (temperature 0.7, top_p 0.80, top_k 20,
# presence_penalty 1.5): vLLM keeps one set of server-side defaults and cannot
# switch them per request.
#
# For contexts beyond the native 262,144 tokens, see qwen3.8-27b-nvfp4-1m.yaml
# rather than raising max_model_len here.

recipe_version: "1"
name: Qwen3.8-27B-NVFP4-MTP
description: vLLM serving unsloth/Qwen3.8-27B-NVFP4 with the checkpoint's MTP speculative head

model: unsloth/Qwen3.8-27B-NVFP4
container: vllm-node

cluster_only: false
solo_only: false

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  max_num_seqs: 8
  num_speculative_tokens: 3

env:
  CUTE_DSL_ARCH: "sm_121a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_FLASHINFER_SAMPLER: "1"

command: |
  vllm serve unsloth/Qwen3.8-27B-NVFP4 \
    --served-model-name qwen3.8-27b \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --limit-mm-per-prompt '{{"image": 4, "video": 1}}' \
    --attention-backend TRITON_ATTN \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --speculative_config.method mtp \
    --speculative_config.model unsloth/Qwen3.8-27B-NVFP4 \
    --speculative_config.num_speculative_tokens {num_speculative_tokens} \
    --speculative_config.attention_backend TRITON_ATTN
