# Recipe: Gemma4-26B-A4B-FP8-Speculative
# Gemma4-26B-A4B with online FP8 quantization and MTP speculative decoding

recipe_version: "1"
name: Gemma4-26B-A4B-FP8-Speculative
description: vLLM serving Gemma4-26B-A4B in FP8 with MTP speculative decoding

# HuggingFace target model to download (optional, for --download-model)
model: google/gemma-4-26B-A4B-it

cluster_only: false
solo_only: false

# Container image to use
container: vllm-node

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 8192

# Environment variables
env: {}

# The vLLM serve command template
command: |
  vllm serve google/gemma-4-26B-A4B-it \
    --max-model-len {max_model_len} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --load-format safetensors \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser gemma4 \
    --reasoning-parser gemma4 \
    --quantization fp8 \
    --kv-cache-dtype fp8 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative-config '{{"method":"mtp","model":"google/gemma-4-26B-A4B-it-assistant","num_speculative_tokens":4,"moe_backend":"triton"}}' \
    -tp {tensor_parallel}
